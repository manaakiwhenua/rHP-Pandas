## conda package definition

package:
  name: rhppandas
  version: 0.2.0

source:
  url: https://pypi.io/packages/source/r/rhppandas/rhppandas-0.2.0.tar.gz
  sha256: 915f3f5944f1437f3d86fd812654a78ad2873330abcad14be4eeba7e7f70c8a5

build:
  noarch: python
  script: pip install .
  number: 0

requirements:
  host:
    - python >=3.11
    - setuptools >=61
    - wheel
    - pip
  run:
    ## uncomment when rhealpixdggs is present on conda-forge
    ### - rhealpixdggs
    - geopandas
    - numpy
    - pandas
    - shapely
    - numpy
    - typing-extensions

## uncomment when rhealpixdggs is present on conda-forge
### tests:
  ### - python:
      ### imports:
        ### - rhppandas
  ### - script:
      ### - pytest site-packages/*/tests
    ### requirements:
      ### run: pytest

about:
  repository: "https://github.com/manaakiwhenua/rHP-Pandas"
  summary: "Integration of rHEALPixDGGS and Pandas/GeoPandas" 
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - alpha-beta-soup
  tags:
    - rhealpix
    - DGGS
    - Discrete Global Grid System
    - geospatial
    - spatial
    - reference system
