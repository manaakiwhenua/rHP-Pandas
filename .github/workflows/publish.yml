name: Publish

# Publishes rhppandas to PyPI with trusted publishing (OIDC): no API tokens
# are stored anywhere. Set up once on pypi.org and test.pypi.org under
# "Publishing" for the rhppandas project:
#   owner: manaakiwhenua   repository: rHP-Pandas
#   workflow: publish.yml  environment: pypi (or testpypi)
#
# Publishing a GitHub release (tag vX.Y.Z) uploads to PyPI.
# Run the workflow by hand with target=testpypi to rehearse against TestPyPI.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    name: Build and check distributions
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the release tag matches pyproject.toml
        if: github.event_name == 'release'
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "pyproject.toml has version $version but the release tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/rhppandas
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI, like PyPI, refuses a filename it has already seen; a
          # re-run of the same version should not fail the whole job.
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rhppandas
    permissions:
      id-token: write
      contents: write  # to attach the distributions to the GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

      - name: Attach distributions to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
